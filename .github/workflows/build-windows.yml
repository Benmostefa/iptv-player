name: Flutter · Build Windows

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate files
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: apps/flutter/build/windows/x64/runner/Release/

      # Publie chaque version de main comme "Release" GitHub : le bouton
      # "Rechercher une mise à jour" de l'application la télécharge de là.
      - name: Zip for release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath iptv-player-windows.zip -Force

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Version ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: apps/flutter/iptv-player-windows.zip
          make_latest: true
